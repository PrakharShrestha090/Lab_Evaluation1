<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-green-400 to-blue-100 min-h-screen">
  <nav class="bg-white shadow flex justify-between items-center px-10 py-4">
    <span class="font-extrabold text-2xl text-green-700">Student Portal</span>
    <ul class="flex gap-7">
      <li><a href="home.html" class="nav-link">Home</a></li>
      <li><a href="students.html" class="nav-link">Students</a></li>
      <li><a href="profile.html" class="nav-link">Profile</a></li>
      <li><a href="#" id="logoutBtn" class="nav-link text-red-500">Logout</a></li>
    </ul>
  </nav>
  <main class="p-8 max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-green-800">Welcome, <span id="userName">Student</span>!</h1>
    <p class="mb-6 text-gray-700">Use the navigation to manage your profile and student registrations.</p>
    <div class="grid gap-4 grid-cols-1 md:grid-cols-2">
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="font-bold text-xl text-blue-600 mb-2">Register New Student</h2>
        <a href="register.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Register</a>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="font-bold text-xl text-purple-600 mb-2">View All Students</h2>
        <a href="students.html" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-700 transition">Students</a>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="font-bold text-xl text-green-600 mb-2">Profile & Settings</h2>
        <a href="profile.html" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-700 transition">Profile</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>

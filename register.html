<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-purple-400 to-blue-200 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-8">
    <h1 class="text-3xl font-bold mb-6 text-center text-purple-800">Register for Student Portal</h1>
    <form id="registerForm" class="flex flex-col gap-4">
      <input type="text" id="regName" placeholder="Name" required class="inputbox">
      <input type="email" id="regEmail" placeholder="Email" required class="inputbox">
      <input type="password" id="regPassword" placeholder="Password" required class="inputbox">
      <input type="text" id="regCourse" placeholder="Course" required class="inputbox">
      <input type="text" id="regContact" placeholder="Contact" required class="inputbox">
      <button type="submit" class="bg-purple-500 text-white py-2 rounded hover:bg-purple-600 transition">Register</button>
      <div class="text-sm text-gray-700 mt-3 text-center">
        Already registered? <a href="index.html" class="text-purple-600 underline">Login here</a>
      </div>
      <div id="registerMsg" class="text-green-600 text-center hidden"></div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
